<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Robert Palmer | Software Engineering Projects</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A curated portfolio of software engineering projects by Robert Palmer, grouped by programming language."
    />
<!-- Add this inside your <head> tags -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/clouds.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>GitHub Projects</h1>
      </header>
      <div class="accordion-controls">
        <button id="expand-all">Expand all</button>
        <button id="collapse-all">Collapse all</button>
      </div>
      <div id="repos">Loading projects…</div>
    </div>
<div id="clouds" aria-hidden="true" class="clouds">
  <div class="cloud cloud--layer1"></div>
  <div class="cloud cloud--layer2"></div>
</div>

    <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    <script>
      const username = "RJPalmer";
      const container = document.getElementById("repos");
      let accordionHeaders = [];
      const expandAllBtn = document.getElementById("expand-all");
      const collapseAllBtn = document.getElementById("collapse-all");

      fetch(`https://api.github.com/users/${username}/repos?per_page=100`)
        .then((res) => res.json())
        .then((repos) => {
          const grouped = {};

          repos.forEach((repo) => {
            const lang = repo.language || "Other";
            if (!grouped[lang]) grouped[lang] = [];
            grouped[lang].push(repo);
          });

          const languages = Object.keys(grouped).sort();

          container.innerHTML = "";

          languages.forEach((lang) => {
            const section = document.createElement("section");
            section.className = "language";

            const header = document.createElement("button");
            header.className = "accordion-header";
            header.setAttribute("aria-expanded", "false");
            header.innerHTML = `<span>${lang} (${grouped[lang].length})</span><span class="chevron">▸</span>`;

            const content = document.createElement("div");
            content.className = "accordion-content";

            header.addEventListener("click", () => {
              const expanded = header.getAttribute("aria-expanded") === "true";
              header.setAttribute("aria-expanded", String(!expanded));
              content.style.display = expanded ? "none" : "block";
              header.querySelector(".chevron").textContent = expanded ? "▸" : "▾";
              updateAccordionControls();
            });

            section.appendChild(header);
            section.appendChild(content);
            accordionHeaders.push({ header, content });

            grouped[lang]
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
              .forEach((repo) => {
                const div = document.createElement("div");
                div.className = "repo";
                if (repo != null) {
                  div.innerHTML = `
                <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                ${repo.description ? `<p>${repo.description}</p>` : ""}
                <div class="meta">
                  ★ ${repo.stargazers_count} • Updated ${new Date(
                    repo.updated_at
                  ).toLocaleDateString()}
                </div>`;
                }
                content.appendChild(div);
              });

            container.appendChild(section);
          });

          function updateAccordionControls() {
            const allExpanded = accordionHeaders.every(
              ({ header }) => header.getAttribute("aria-expanded") === "true"
            );
            const allCollapsed = accordionHeaders.every(
              ({ header }) => header.getAttribute("aria-expanded") === "false"
            );

            expandAllBtn.disabled = allExpanded;
            collapseAllBtn.disabled = allCollapsed;
          }

          document.getElementById("expand-all").addEventListener("click", () => {
            accordionHeaders.forEach(({ header, content }) => {
              header.setAttribute("aria-expanded", "true");
              content.style.display = "block";
              header.querySelector(".chevron").textContent = "▾";
            });
            updateAccordionControls();
          });

          document.getElementById("collapse-all").addEventListener("click", () => {
            accordionHeaders.forEach(({ header, content }) => {
              header.setAttribute("aria-expanded", "false");
              content.style.display = "none";
              header.querySelector(".chevron").textContent = "▸";
            });
            updateAccordionControls();
          });

          updateAccordionControls();
        })
        .catch(() => {
          container.innerHTML = "Unable to load repositories.";
        });
    </script>
<script>
  const toggle = document.getElementById("theme-toggle");
  const savedTheme = localStorage.getItem("theme");
  const prefersDark =
    window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches;

  // Decide initial theme: saved choice wins, otherwise system preference
  const initialTheme = savedTheme || (prefersDark ? "dark" : "light");

  // Apply initial theme and sync the button text
  document.documentElement.setAttribute("data-theme", initialTheme);
  toggle.textContent = initialTheme === "dark" ? "☀️" : "🌙";

  // Toggle handler (keeps existing behavior)
  toggle.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    toggle.textContent = next === "dark" ? "☀️" : "🌙";
  });
</script>
    </script>
    <!-- Add this block near the end of the <body> on your homepage (just before </body>) -->
<style>
  /* Minimal styles for the music control — adapt to your site's design */
  .music-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.8rem;
    font-size: 0.95rem;
    cursor: pointer;
    border-radius: 4px;
    border: 1px solid rgba(0,0,0,0.08);
    background: rgba(255,255,255,0.02);
  }
  .music-toggle:focus { outline: 3px solid Highlight; }
  .visually-hidden { position: absolute !important; height: 1px; width: 1px; overflow: hidden; clip: rect(1px,1px,1px,1px); white-space: nowrap; }
</style>

<!-- Background music control -->
<button id="musicToggle" class="music-toggle" aria-pressed="false" aria-label="Play background music" type="button">
  <span id="musicIcon">▶</span>
  <span id="musicLabel">Play music</span>
</button>

<!-- Hidden audio element; src intentionally omitted to avoid preloading the MP4 -->
<audio id="bgAudio" preload="none" loop aria-hidden="true"></audio>

<script>
(function () {
  const STORAGE_KEY = 'bgAudioEnabled';
  const AUDIO_PATH = '/assets/media/Recording 1.mp4'; // exact path to your MP4 file (contains a space)
  const audio = document.getElementById('bgAudio');
  const btn = document.getElementById('musicToggle');
  const icon = document.getElementById('musicIcon');
  const label = document.getElementById('musicLabel');
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Restore preference; default to off if user prefers reduced motion and no saved pref
  let enabled = localStorage.getItem(STORAGE_KEY) === 'true';
  if (prefersReduced && localStorage.getItem(STORAGE_KEY) === null) enabled = false;

  function updateUI() {
    btn.setAttribute('aria-pressed', String(enabled));
    icon.textContent = enabled ? '⏸' : '▶';
    label.textContent = enabled ? 'Pause music' : 'Play music';
  }

  async function enableAudio() {
    // Lazy-load the audio file only when the user explicitly enables it
    if (!audio.src) {
      // Note: file name contains a space; most servers handle it, but URL-encoding is safe.
      // Using a literal path preserves your repository filename. If you later rename file, update AUDIO_PATH.
      audio.src = AUDIO_PATH;
    }
    try {
      // Because this call is triggered by a user click, playback should be allowed by browsers.
      await audio.play();
      enabled = true;
      localStorage.setItem(STORAGE_KEY, 'true');
      updateUI();
    } catch (err) {
      console.warn('Playback failed:', err);
      enabled = false;
      localStorage.setItem(STORAGE_KEY, 'false');
      updateUI();
    }
  }

  function disableAudio() {
    audio.pause();
    enabled = false;
    localStorage.setItem(STORAGE_KEY, 'false');
    updateUI();
  }

  btn.addEventListener('click', () => {
    if (enabled) disableAudio();
    else enableAudio();
  });

  // Ensure keyboard activation works reliably (button already supports Enter/Space, but keep this robust)
  btn.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      btn.click();
    }
  });

  // Initial UI state (no autoplay)
  updateUI();
})();
</script>
<!-- End of background music block -->
    
  </body>
</html>
