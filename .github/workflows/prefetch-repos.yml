name: Update public repository data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # daily, UTC
  push:
      branches:
        - main
        - 1-add-github-action-to-prefetch-repos-into-static-json-and-update-site-to-use-it
permissions:
  contents: write

jobs:
  update-repos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{github.ref_name}}

      - name: Fetch public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
            node <<'NODE'
            import fs from "node:fs";
            import path from "node:path";
            
            async function getRepos() {
              const repos = [];

            for (let page = 1; ; page++) {
              const url = new URL(`${process.env.GITHUB_API_URL}/users/RJPalmer/repos`);
              url.search = new URLSearchParams({
                visibility: "public",
                affiliation: "owner",
                per_page: "100",
                page: String(page),
              });
          
            const response = await fetch(url, {
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                },
              });
          
            if (!response.ok) {
                throw new Error(`GitHub API failed: ${response.status} ${await response.text()}`);
              }
          
            const pageRepos = await response.json();
              repos.push(...pageRepos);
          
            if (pageRepos.length < 100) break;
            }

            return repos
              .map(({ name, html_url, description, stargazers_count, updated_at, language }) => ({
                name,
                html_url,
                description,
                stargazers_count,
                updated_at,
                language,
              }))
                .sort((a, b) => a.name.localeCompare(b.name));
            }
            
            const outputPath = "data/repos.json";
            fs.mkdirSync(path.dirname(outputPath), { recursive: true });
            fs.writeFileSync(outputPath, `${JSON.stringify(await getRepos(), null, 2)}\n`);
            NODE

      - name: Commit updated repository data
        run: |
          git add data/repos.json

          if git diff --cached --quiet; then
            echo "No repository-data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: update repos.json"
          git push origin HEAD:main
