<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Robert Palmer | Software Engineering Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A curated portfolio of software engineering projects by Robert Palmer, grouped by programming language." />

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <h1>GitHub Projects</h1>
  <div id="repos">Loading projects…</div>

  <script>
    const username = "RJPalmer";
    const container = document.getElementById("repos");

    fetch(`https://api.github.com/users/${username}/repos?per_page=100`)
      .then(res => res.json())
      .then(repos => {
        const grouped = {};

        repos.forEach(repo => {
          const lang = repo.language || "Other";
          if (!grouped[lang]) grouped[lang] = [];
          grouped[lang].push(repo);
        });

        const languages = Object.keys(grouped).sort();

        container.innerHTML = "";

        languages.forEach(lang => {
          const section = document.createElement("section");
          section.className = "language";

          section.innerHTML = `<h2>${lang}</h2>`;

          grouped[lang]
            .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
            .forEach(repo => {
              const div = document.createElement("div");
              div.className = "repo";

              div.innerHTML = `
                <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                ${repo.description ? `<p>${repo.description}</p>` : ""}
                <div class="meta">
                  ★ ${repo.stargazers_count} • Updated ${new Date(repo.updated_at).toLocaleDateString()}
                </div>
              

              section.appendChild(div);
            });

          container.appendChild(section);
        });
      })
      .catch(() => {
        container.innerHTML = "Unable to load repositories.";
      });
  </script>

</body>
</html>
