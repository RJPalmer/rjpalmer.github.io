<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Robert Palmer | Software Engineering Projects</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A curated portfolio of software engineering projects by Robert Palmer, grouped by programming language."
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>GitHub Projects</h1>
      </header>
      <div class="accordion-controls">
        <button id="expand-all">Expand all</button>
        <button id="collapse-all">Collapse all</button>
      </div>
      <div id="repos">Loading projects…</div>
    </div>

    <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    <script>
      const username = "RJPalmer";
      const container = document.getElementById("repos");
      let accordionHeaders = [];

      fetch(`https://api.github.com/users/${username}/repos?per_page=100`)
        .then((res) => res.json())
        .then((repos) => {
          const grouped = {};

          repos.forEach((repo) => {
            const lang = repo.language || "Other";
            if (!grouped[lang]) grouped[lang] = [];
            grouped[lang].push(repo);
          });

          const languages = Object.keys(grouped).sort();

          container.innerHTML = "";

          languages.forEach((lang) => {
            const section = document.createElement("section");
            section.className = "language";

            const header = document.createElement("button");
            header.className = "accordion-header";
            header.setAttribute("aria-expanded", "false");
            header.innerHTML = `<span>${lang}</span><span class="chevron">▸</span>`;

            const content = document.createElement("div");
            content.className = "accordion-content";

            header.addEventListener("click", () => {
              const expanded = header.getAttribute("aria-expanded") === "true";
              header.setAttribute("aria-expanded", String(!expanded));
              content.style.display = expanded ? "none" : "block";
              header.querySelector(".chevron").textContent = expanded ? "▸" : "▾";
            });

            section.appendChild(header);
            section.appendChild(content);
            accordionHeaders.push({ header, content });

            grouped[lang]
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
              .forEach((repo) => {
                const div = document.createElement("div");
                div.className = "repo";
                if (repo != null) {
                  div.innerHTML = `
                <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                ${repo.description ? `<p>${repo.description}</p>` : ""}
                <div class="meta">
                  ★ ${repo.stargazers_count} • Updated ${new Date(
                    repo.updated_at
                  ).toLocaleDateString()}
                </div>`;
                }
                content.appendChild(div);
              });

            container.appendChild(section);
          });

          document.getElementById("expand-all").addEventListener("click", () => {
            accordionHeaders.forEach(({ header, content }) => {
              header.setAttribute("aria-expanded", "true");
              content.style.display = "block";
              header.querySelector(".chevron").textContent = "▾";
            });
          });

          document.getElementById("collapse-all").addEventListener("click", () => {
            accordionHeaders.forEach(({ header, content }) => {
              header.setAttribute("aria-expanded", "false");
              content.style.display = "none";
              header.querySelector(".chevron").textContent = "▸";
            });
          });
        })
        .catch(() => {
          container.innerHTML = "Unable to load repositories.";
        });
    </script>
    <script>
      const toggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
        toggle.textContent = savedTheme === "dark" ? "☀️" : "🌙";
      }

      toggle.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";

        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        toggle.textContent = next === "dark" ? "☀️" : "🌙";
      });
    </script>
  </body>
</html>
