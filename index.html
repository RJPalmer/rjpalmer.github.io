<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GitHub Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fafafa;
      color: #222;
      margin: 0;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 3rem;
    }

    .language {
      margin-bottom: 3rem;
    }

    .language h2 {
      border-bottom: 2px solid #ddd;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .repo {
      background: #fff;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      margin-bottom: 1rem;
    }

    .repo a {
      font-weight: 600;
      text-decoration: none;
      color: #0366d6;
    }

    .repo p {
      margin: 0.4rem 0 0;
      font-size: 0.9rem;
      color: #555;
    }

    .meta {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #777;
    }
  </style>
</head>
<body>

  <h1>GitHub Projects</h1>
  <div id="repos">Loading projects…</div>

  <script>
    const username = "RJPalmer";
    const container = document.getElementById("repos");

    fetch(`https://api.github.com/users/${username}/repos?per_page=100`)
      .then(res => res.json())
      .then(repos => {
        const grouped = {};

        repos.forEach(repo => {
          const lang = repo.language || "Other";
          if (!grouped[lang]) grouped[lang] = [];
          grouped[lang].push(repo);
        });

        const languages = Object.keys(grouped).sort();

        container.innerHTML = "";

        languages.forEach(lang => {
          const section = document.createElement("section");
          section.className = "language";

          section.innerHTML = `<h2>${lang}</h2>`;

          grouped[lang]
            .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))
            .forEach(repo => {
              const div = document.createElement("div");
              div.className = "repo";

              div.innerHTML = `
                <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                ${repo.description ? `<p>${repo.description}</p>` : ""}
                <div class="meta">
                  ★ ${repo.stargazers_count} • Updated ${new Date(repo.updated_at).toLocaleDateString()}
                </div>
              `;

              section.appendChild(div);
            });

          container.appendChild(section);
        });
      })
      .catch(() => {
        container.innerHTML = "Unable to load repositories.";
      });
  </script>

</body>
</html>
